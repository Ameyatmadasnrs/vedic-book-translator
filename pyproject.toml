[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-book-translator"
version = "0.1.0"
description = "A professional AI-powered book translation platform specialized for Vedic, Sanskrit, and Gaudiya Vaishnava texts into Russian."
readme = "README.md"
authors = [
    { name = "Vedic Book Translator Team" }
]
license = { text = "Proprietary" }
requires-python = ">=3.11"
keywords = [
    "vedic", "sanskrit", "translation", "gaudiya-vaishnavism",
    "russian", "nlp", "ai-translation", "book-publishing"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Religion",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    # Core Data & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    
    # CLI & Runtime
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    
    # Document Processing & Extraction
    "pymupdf>=1.24.0",          # High-performance PDF parser & text extraction
    "python-docx>=1.1.0",        # DOCX extraction & generation
    "ebooklib>=0.18",            # EPUB extraction & generation
    "beautifulsoup4>=4.12.3",    # HTML/EPUB XML parsing
    "pytesseract>=0.3.10",       # OCR interface for scanned Sanskrit/English/Russian texts
    "pillow>=10.3.0",            # Image pre-processing for OCR
    
    # AI Providers & Orchestration
    "google-genai>=0.3.0",       # Native Gemini API
    "anthropic>=0.25.0",         # Anthropic Claude API
    "openai>=1.25.0",            # OpenAI & compatible local endpoints (vLLM, Ollama)
    "httpx>=0.27.0",             # Async HTTP client
    "tenacity>=8.2.3",           # Retry and resilience
    
    # Linguistic & Sanskrit / Russian NLP
    "indic-transliteration>=2.3.56", # Sanskrit IAST, Harvard-Kyoto, Devanagari, SLP1
    "pymorphy3>=2.0.2",              # Russian morphology & declension engine
    
    # Translation Memory & Vector Search (Lightweight embedded)
    "sqlite-utils>=3.36",
    
    # Quality & Publishing
    "jinja2>=3.1.3",
    "weasyprint>=61.2; sys_platform != 'win32'", # Linux/macOS PDF publishing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0"
]

[project.scripts]
vedic-translate = "vedic_translator.orchestrator.runner:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/vedic_translator"
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".pytest_cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
data_file = ".coverage"
source = ["src/vedic_translator"]
branch = false

[tool.coverage.report]
show_missing = true
